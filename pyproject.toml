[project]
name = "time-to-fill-survival"
version = "0.1.0"
description = "Time-to-fill survival analysis demo with dbt, DuckDB and lifelines."
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "lifelines>=0.30.3",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle errors and pyflakes, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
